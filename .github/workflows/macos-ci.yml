name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Tests and package audit
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift tests
        run: swift test --package-path macos

      - name: Audit layout-conversion collisions
        run: python3 scripts/audit_short.py

      - name: Validate release scripts
        run: |
          bash -n macos/build_app.sh
          bash -n macos/create_dmg.sh

      - name: Build and verify application bundle
        env:
          RS_OUTPUT_DIR: ${{ runner.temp }}/typeflow-ci
        run: |
          macos/build_app.sh
          test -x "$RS_OUTPUT_DIR/TypeFlow.app/Contents/MacOS/TypeFlow"
          codesign --verify --deep --strict --verbose=2 "$RS_OUTPUT_DIR/TypeFlow.app"
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RS_OUTPUT_DIR/TypeFlow.app/Contents/Info.plist")
          manifest_version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          test "$bundle_version" = "$manifest_version"
